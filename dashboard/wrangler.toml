name = "makemake-seo-dashboard"
main = "worker.js"
compatibility_date = "2026-08-24"
# The Worker is deployed from GitHub while non-secret operational settings are
# managed in the Cloudflare dashboard. Preserve those settings on every build.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# Authentication must run before any HTML, JS, CSS, or API response is served.
run_worker_first = true

[[kv_namespaces]]
binding = "SEO_CACHE"
id = "c6c38a232ce147b38f868d659f775f0a"

[triggers]
crons = ["15 2 * * *"]
